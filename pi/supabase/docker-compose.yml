services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aog_pg
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-aog.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aog"]
      interval: 5s
      timeout: 5s
      retries: 20

  rest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:aog_authenticator@db:5432/aog
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: aog-local-jwt-secret-change-me-32bytes
      PGRST_OPENAPI_SERVER_PROXY_URI: http://127.0.0.1:8000

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - rest
    ports:
      - "8000:8000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  pgdata:
